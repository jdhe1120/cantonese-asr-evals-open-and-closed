[project]
name = "cantonese-asr-evals-open-and-closed"
version = "0.1.0"
description = "Small Cantonese ASR eval harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=5.13",
    "accelerate>=1.2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencc-python-reimplemented>=0.1.7",
    "funasr>=1.4",
    "torchaudio>=2.11.0",
    "pyarrow>=26.0.0",
]

[tool.uv]
package = false
