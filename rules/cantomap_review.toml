# Candidates come from scripts/audit_clips.py; the verdict is a person's, after listening to the clip.
#   broken     the audio doesn't say the reference at all; skipped by scripts/prepare_public.py
#   ok         the reference matches; the clip is just hard (kept)
#   cut-start  the reference's opening words are not in the audio (clip edge); kept, reference unchanged
#   cut-end    the reference's closing words are not in the audio (clip edge); kept, reference unchanged
# Whole recordings that don't match their transcripts are CMAP_BROKEN in scripts/prepare_public.py.

